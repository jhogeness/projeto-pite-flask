{% extends "base.html" %}
{% block content %}
<h2>Gerenciar Matérias</h2>
<form method="POST" class="bg-white p-4 shadow-sm rounded mb-4">
    <div class="mb-3">
        <label class="form-label">Nome da Matéria</label>
        <input type="text" name="nome" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">Adicionar Matéria</button>
</form>

<ul class="list-group">
    {% for m in materias %}
        <li class="list-group-item">{{ m.nome }}</li>
    {% else %}
        <li class="list-group-item">Nenhuma matéria cadastrada.</li>
    {% endfor %}
</ul>
{% endblock %}
